name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Позволяет запускать вручную из вкладки Actions

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04  # Зафиксировано, чтобы не было проблем с libtinfo5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 3.11 стабильнее для p4a, чем 3.12/3.14

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Clone python-for-android locally
        run: |
          # Клонируем develop-ветку, где могут быть фиксы
          git clone https://github.com/kivy/python-for-android.git --depth 1 -b develop p4a-local

      - name: Create local recipe for charset_normalizer
        run: |
          mkdir -p p4a-recipes/charset_normalizer
          cat > p4a-recipes/charset_normalizer/__init__.py << 'EOF'
          from pythonforandroid.recipe import PythonRecipe

          class CharsetNormalizerRecipe(PythonRecipe):
              version = '3.3.2'
              url = 'https://files.pythonhosted.org/packages/source/c/charset-normalizer/charset_normalizer-{version}.tar.gz'
              depends = ['setuptools']
              call_hostpython_via_targetpython = False
              site_packages_name = 'charset_normalizer'

          recipe = CharsetNormalizerRecipe()
          EOF

      - name: Point buildozer to local recipes
        run: |
          # Удаляем старые настройки p4a, если есть
          sed -i '/^p4a.source_dir/d' buildozer.spec
          sed -i '/^p4a.local_recipes/d' buildozer.spec
          # ВАЖНО: используем абсолютный путь, чтобы Buildozer не потерял его при смене CWD
          echo "p4a.local_recipes = $(pwd)/p4a-recipes" >> buildozer.spec
      - name: Build with Buildozer
        run: |
          # --verbose для отладки, если упадёт — будет видно, на каком шаге
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-apk
          path: bin/*.apk
